<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://fav.farm/⚛️" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f11" />
    <title>Aether | Generative Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #0f0f11; /* Surface Dark */
        color: #fdfdfd;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      /* Material 3 Expressive Easing */
      .ease-emphasized {
        transition-timing-function: cubic-bezier(0.2, 0.0, 0.0, 1.0);
      }
      
      /* Energy Beam Animation */
      @keyframes beam-flow {
        0% { background-position: 0% 0%; }
        100% { background-position: 0% 200%; }
      }
      .animate-beam {
        background-size: 100% 200%;
        animation: beam-flow 2s linear infinite;
      }

      /* Hide scrollbar for chrome/safari/opera */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f11;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d2d33;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #44444a;
      }
    </style>
